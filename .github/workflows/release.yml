name: Release candidate

# Protected release flags control signing, staging and public promotion.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build a release or verify publisher access without signing
        type: choice
        default: release
        options:
          - release
          - verify-publisher
      tag:
        description: Existing release tag on the current main commit
        required: false
        type: string
      resume_run_id:
        description: Run ID that contains the original candidate artifact, for recovery
        required: false
        type: string
      start_staging:
        description: Start staging for a candidate that has never been staged
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-rehearsal
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  RESUME_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id || '' }}
  START_STAGING: ${{ inputs.start_staging && 'true' || 'false' }}

jobs:
  rehearsal:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'release' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag, version, and main
        run: python scripts/release-preflight.py "$RELEASE_TAG"
      - name: Validate recovery run ID
        shell: bash
        run: |
          if [[ -n "$RESUME_RUN_ID" && ! "$RESUME_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Invalid recovery run ID.' >&2
            exit 1
          fi
          if [[ "$START_STAGING" == true && -z "$RESUME_RUN_ID" ]]; then
            echo 'Starting staging for an existing candidate requires its run ID.' >&2
            exit 1
          fi
      - name: Check published version and build history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ -n "$RESUME_RUN_ID" && "$START_STAGING" != true ]]; then
            python scripts/release-history.py --resume-candidate
          else
            python scripts/release-history.py
          fi
      - name: Install Python test dependency
        run: python -m pip install 'Pillow>=10,<13' 'cryptography>=44,<46'
      - name: Resolve Sparkle tools
        run: swift package resolve
      - name: Run Python checks
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Check website release availability
        run: node --test website/release.test.mjs
      - name: Check Actions matrix structure
        run: python scripts/audit-action-api.py --check
      - name: Run Swift tests and verify inventory
        run: python scripts/run-swift-tests.py --output-dir "$RUNNER_TEMP/draftly-release-rehearsal"
      - name: Build local app
        run: scripts/build-app.sh --local
      - name: Verify local app identity
        shell: bash
        run: |
          app=.build/xcode/Build/Products/Debug/Draftly.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")" = com.pobrespandas.draftly
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleURLTypes:0:CFBundleURLSchemes:0' "$app/Contents/Info.plist")" = draftly
          codesign --verify --deep --strict "$app"
      - name: Report rehearsal scope
        run: echo 'Rehearsal only. No signed release, appcast, GitHub Release, or site was published.'

  candidate:
    name: Sign and notarize a candidate
    needs: rehearsal
    if: ${{ vars.DRAFTLY_RELEASE_SIGNING_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '') }}
    environment: release
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck tag and source
        run: python scripts/release-preflight.py "$RELEASE_TAG"
      - name: Build the signed candidate
        if: ${{ env.RESUME_RUN_ID == '' }}
        env:
          DRAFTLY_DEVELOPER_ID_PROFILE: ${{ vars.DRAFTLY_DEVELOPER_ID_PROFILE }}
          DRAFTLY_SPARKLE_PUBLIC_KEY: ${{ vars.DRAFTLY_SPARKLE_PUBLIC_KEY }}
          APPLE_DEVELOPER_ID_P12_B64: ${{ secrets.APPLE_DEVELOPER_ID_P12_B64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_DEVELOPER_ID_PROFILE_B64: ${{ secrets.APPLE_DEVELOPER_ID_PROFILE_B64 }}
          APPLE_NOTARY_API_KEY_B64: ${{ secrets.APPLE_NOTARY_API_KEY_B64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main || "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo 'Use the original candidate artifact for recovery; do not build another candidate.' >&2
            exit 1
          fi
          bash scripts/release-candidate-ci.sh
      - name: Restore the original candidate
        if: ${{ env.RESUME_RUN_ID != '' }}
        uses: actions/download-artifact@v4
        with:
          name: draftly-release-candidate-${{ env.RELEASE_TAG }}
          path: .build/release-candidates/${{ env.RELEASE_TAG }}
          github-token: ${{ github.token }}
          run-id: ${{ env.RESUME_RUN_ID }}
      - name: Install candidate verification dependency
        if: ${{ env.RESUME_RUN_ID != '' }}
        run: python -m pip install 'cryptography>=44,<46'
      - name: Verify the restored candidate
        if: ${{ env.RESUME_RUN_ID != '' }}
        env:
          DRAFTLY_SPARKLE_PUBLIC_KEY: ${{ vars.DRAFTLY_SPARKLE_PUBLIC_KEY }}
        run: python scripts/verify-release-candidate.py --candidate ".build/release-candidates/$RELEASE_TAG" --tag "$RELEASE_TAG" --public-key "$DRAFTLY_SPARKLE_PUBLIC_KEY"
      - name: Save verified candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: draftly-release-candidate-${{ env.RELEASE_TAG }}
          path: |
            .build/release-candidates/${{ env.RELEASE_TAG }}/Draftly.zip
            .build/release-candidates/${{ env.RELEASE_TAG }}/Draftly.zip.sha256
            .build/release-candidates/${{ env.RELEASE_TAG }}/candidate.json
            .build/release-candidates/${{ env.RELEASE_TAG }}/signing-report.json
            .build/release-candidates/${{ env.RELEASE_TAG }}/notary-submission.json
            .build/release-candidates/${{ env.RELEASE_TAG }}/READY
          if-no-files-found: error
          retention-days: 14
      - name: Preserve incomplete notary submission for recovery
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: draftly-notary-recovery-${{ env.RELEASE_TAG }}
          path: |
            .build/release-candidates/${{ env.RELEASE_TAG }}/notary-submission.json
            .build/release-candidates/${{ env.RELEASE_TAG }}/notary-submission.zip
          if-no-files-found: ignore
          retention-days: 14

  stage:
    name: Stage update feed and GitHub draft
    needs: candidate
    if: ${{ vars.DRAFTLY_RELEASE_STAGING_ENABLED == 'true' }}
    environment: release
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependency
        run: python -m pip install 'cryptography>=44,<46'
      - name: Resolve Sparkle tools
        run: swift package resolve
      - name: Download the candidate from this run
        uses: actions/download-artifact@v4
        with:
          name: draftly-release-candidate-${{ env.RELEASE_TAG }}
          path: .build/release-candidates/${{ env.RELEASE_TAG }}
      - name: Verify the candidate before staging
        env:
          DRAFTLY_SPARKLE_PUBLIC_KEY: ${{ vars.DRAFTLY_SPARKLE_PUBLIC_KEY }}
        run: python scripts/verify-release-candidate.py --candidate ".build/release-candidates/$RELEASE_TAG" --tag "$RELEASE_TAG" --public-key "$DRAFTLY_SPARKLE_PUBLIC_KEY"
      - name: Restore the original staging checkpoint
        if: ${{ env.RESUME_RUN_ID != '' && env.START_STAGING != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: draftly-release-staging-${{ env.RELEASE_TAG }}
          path: .build/release-staging/${{ env.RELEASE_TAG }}
          github-token: ${{ github.token }}
          run-id: ${{ env.RESUME_RUN_ID }}
      - name: Prepare the signed update feed
        if: ${{ env.RESUME_RUN_ID == '' || env.START_STAGING == 'true' }}
        env:
          DRAFTLY_SPARKLE_PRIVATE_KEY: ${{ secrets.DRAFTLY_SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/prepare-appcast.py --candidate ".build/release-candidates/$RELEASE_TAG" \
            --output ".build/release-staging/$RELEASE_TAG" --notes "docs/releases/$RELEASE_TAG.txt"
      - name: Authenticate to Firebase
        id: firebase_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.DRAFTLY_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.DRAFTLY_GCP_SERVICE_ACCOUNT }}
          project_id: gen-lang-client-0607406471
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - name: Acquire or verify the site writer lock
        env:
          DRAFTLY_RELEASE_LOCK_TOKEN: ${{ steps.firebase_auth.outputs.access_token }}
          LOCK_BUCKET: ${{ vars.DRAFTLY_RELEASE_LOCK_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LOCK_BUCKET"
          journal=".build/release-staging/$RELEASE_TAG/site-lock.json"
          if [[ -n "$RESUME_RUN_ID" && "$START_STAGING" != true ]]; then
            test -f "$journal"
            python scripts/release-lock.py check --bucket "$LOCK_BUCKET" --journal "$journal"
          else
            python scripts/release-lock.py acquire --bucket "$LOCK_BUCKET" --journal "$journal"
          fi
      - name: Stage the feed without promoting the site
        env:
          DRAFTLY_FIREBASE_ACCESS_TOKEN: ${{ steps.firebase_auth.outputs.access_token }}
          DRAFTLY_SPARKLE_PUBLIC_KEY: ${{ vars.DRAFTLY_SPARKLE_PUBLIC_KEY }}
          DRAFTLY_SITE_BASE_COMMIT: ${{ vars.DRAFTLY_SITE_BASE_COMMIT }}
          DRAFTLY_RELEASE_LOCK_TOKEN: ${{ steps.firebase_auth.outputs.access_token }}
          LOCK_BUCKET: ${{ vars.DRAFTLY_RELEASE_LOCK_BUCKET }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DRAFTLY_SITE_BASE_COMMIT"
          python scripts/release-lock.py check --bucket "$LOCK_BUCKET" \
            --journal ".build/release-staging/$RELEASE_TAG/site-lock.json"
          site_target=$(git rev-parse HEAD)
          stage_dir=".build/release-staging/$RELEASE_TAG"
          journal="$stage_dir/firebase-journal.json"
          receipt="$RUNNER_TEMP/firebase-receipt.json"
          if [[ -n "$RESUME_RUN_ID" && "$START_STAGING" != true ]]; then
            test -f "$journal"
            base=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["baseVersion"])' "$journal")
            site_base=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["websiteSource"]["base"])' "$journal")
            python scripts/firebase-stage-appcast.py --appcast "$stage_dir/appcast.xml" \
              --public-key "$DRAFTLY_SPARKLE_PUBLIC_KEY" --expected-version "$base" \
              --journal "$journal" --site-base "$site_base" \
              --site-target "$site_target" --resume > "$receipt"
          else
            python scripts/firebase-stage-appcast.py --inspect --bootstrap-site-base "$DRAFTLY_SITE_BASE_COMMIT" > "$RUNNER_TEMP/firebase-live.json"
            base=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["liveVersion"])' "$RUNNER_TEMP/firebase-live.json")
            site_base=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["siteBaseCommit"])' "$RUNNER_TEMP/firebase-live.json")
            python scripts/firebase-stage-appcast.py --appcast "$stage_dir/appcast.xml" \
              --public-key "$DRAFTLY_SPARKLE_PUBLIC_KEY" --expected-version "$base" \
              --journal "$journal" --site-base "$site_base" \
              --site-target "$site_target" > "$receipt"
          fi
          mv "$receipt" "$stage_dir/firebase-receipt.json"
      - name: Verify and stage the GitHub draft
        env:
          DRAFTLY_SPARKLE_PRIVATE_KEY: ${{ secrets.DRAFTLY_SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/stage-github-release.py --candidate ".build/release-candidates/$RELEASE_TAG" \
            --appcast ".build/release-staging/$RELEASE_TAG" --notes "docs/releases/$RELEASE_TAG.txt"
      - name: Publish and verify the GitHub assets
        if: ${{ vars.DRAFTLY_RELEASE_PUBLICATION_ENABLED == 'true' }}
        env:
          DRAFTLY_RELEASE_PUBLISH_ENABLED: 'YES'
          DRAFTLY_FIREBASE_ACCESS_TOKEN: ${{ steps.firebase_auth.outputs.access_token }}
          DRAFTLY_SPARKLE_PRIVATE_KEY: ${{ secrets.DRAFTLY_SPARKLE_PRIVATE_KEY }}
          DRAFTLY_RELEASE_LOCK_TOKEN: ${{ steps.firebase_auth.outputs.access_token }}
          LOCK_BUCKET: ${{ vars.DRAFTLY_RELEASE_LOCK_BUCKET }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          stage_dir=".build/release-staging/$RELEASE_TAG"
          python scripts/release-lock.py check --bucket "$LOCK_BUCKET" --journal "$stage_dir/site-lock.json"
          python scripts/publish-github-release.py --candidate ".build/release-candidates/$RELEASE_TAG" \
            --appcast "$stage_dir" --notes "docs/releases/$RELEASE_TAG.txt" \
            --firebase-receipt "$stage_dir/firebase-receipt.json"
          cp ".build/release-candidates/$RELEASE_TAG/PUBLIC_VERIFIED.json" "$stage_dir/PUBLIC_VERIFIED.json"
      - name: Promote and verify the public site
        if: ${{ vars.DRAFTLY_RELEASE_PUBLICATION_ENABLED == 'true' }}
        env:
          DRAFTLY_RELEASE_PUBLISH_ENABLED: 'YES'
          DRAFTLY_RELEASE_PROMOTION_ENABLED: 'YES'
          DRAFTLY_FIREBASE_ACCESS_TOKEN: ${{ steps.firebase_auth.outputs.access_token }}
          DRAFTLY_SPARKLE_PRIVATE_KEY: ${{ secrets.DRAFTLY_SPARKLE_PRIVATE_KEY }}
          LOCK_BUCKET: ${{ vars.DRAFTLY_RELEASE_LOCK_BUCKET }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          stage_dir=".build/release-staging/$RELEASE_TAG"
          python scripts/promote-firebase-release.py --candidate ".build/release-candidates/$RELEASE_TAG" \
            --appcast "$stage_dir" --notes "docs/releases/$RELEASE_TAG.txt" \
            --firebase-receipt "$stage_dir/firebase-receipt.json" \
            --journal "$stage_dir/promotion-journal.json" \
            --lock-bucket "$LOCK_BUCKET" --lock-journal "$stage_dir/site-lock.json"
      - name: Release the writer lock after public verification
        if: ${{ vars.DRAFTLY_RELEASE_PUBLICATION_ENABLED == 'true' }}
        env:
          DRAFTLY_RELEASE_LOCK_TOKEN: ${{ steps.firebase_auth.outputs.access_token }}
          LOCK_BUCKET: ${{ vars.DRAFTLY_RELEASE_LOCK_BUCKET }}
        run: python scripts/release-lock.py release --bucket "$LOCK_BUCKET" --journal ".build/release-staging/$RELEASE_TAG/site-lock.json"
      - name: Preserve the staging checkpoint
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: draftly-release-staging-${{ env.RELEASE_TAG }}
          path: .build/release-staging/${{ env.RELEASE_TAG }}/
          if-no-files-found: ignore
          retention-days: 14

  verify-publisher:
    name: Verify publisher identity and lock
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'verify-publisher' && inputs.tag == '' && inputs.resume_run_id == '' }}
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependency
        run: python -m pip install 'cryptography>=44,<46'
      - name: Authenticate publisher
        id: firebase_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.DRAFTLY_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.DRAFTLY_GCP_SERVICE_ACCOUNT }}
          project_id: gen-lang-client-0607406471
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - name: Inspect Hosting and exercise the lock
        env:
          DRAFTLY_FIREBASE_ACCESS_TOKEN: ${{ steps.firebase_auth.outputs.access_token }}
          DRAFTLY_RELEASE_LOCK_TOKEN: ${{ steps.firebase_auth.outputs.access_token }}
          LOCK_BUCKET: ${{ vars.DRAFTLY_RELEASE_LOCK_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/firebase-stage-appcast.py --inspect
          journal="$RUNNER_TEMP/publisher-lock.json"
          python scripts/release-lock.py acquire --bucket "$LOCK_BUCKET" --journal "$journal"
          python scripts/release-lock.py check --bucket "$LOCK_BUCKET" --journal "$journal"
          python scripts/release-lock.py release --bucket "$LOCK_BUCKET" --journal "$journal"
      - name: Preserve publisher lock recovery state
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: publisher-lock-check
          path: ${{ runner.temp }}/publisher-lock.json
          if-no-files-found: ignore
          retention-days: 14
