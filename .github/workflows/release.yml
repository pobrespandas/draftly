name: Release candidate

# This workflow cannot publish. Release signing and publishing need acceptance.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag on the current main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-rehearsal
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  rehearsal:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag, version, and main
        run: python scripts/release-preflight.py "$RELEASE_TAG"
      - name: Check published version and build history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release-history.py
      - name: Install Python test dependency
        run: python -m pip install 'Pillow>=10,<13' 'cryptography>=44,<46'
      - name: Resolve Sparkle tools
        run: swift package resolve
      - name: Run Python checks
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Check Actions matrix structure
        run: python scripts/audit-action-api.py --check
      - name: Run Swift tests and verify inventory
        run: python scripts/run-swift-tests.py --output-dir "$RUNNER_TEMP/draftly-release-rehearsal"
      - name: Build local app
        run: scripts/build-app.sh --local
      - name: Verify local app identity
        shell: bash
        run: |
          app=.build/xcode/Build/Products/Debug/Draftly.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")" = com.pobrespandas.draftly
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleURLTypes:0:CFBundleURLSchemes:0' "$app/Contents/Info.plist")" = draftly
          codesign --verify --deep --strict "$app"
      - name: Report rehearsal scope
        run: echo 'Rehearsal only. No signed release, appcast, GitHub Release, or site was published.'

  candidate:
    name: Sign and notarize a candidate
    needs: rehearsal
    if: ${{ vars.DRAFTLY_RELEASE_SIGNING_ENABLED == 'true' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck tag and source
        run: python scripts/release-preflight.py "$RELEASE_TAG"
      - name: Build the signed candidate
        env:
          DRAFTLY_DEVELOPER_ID_PROFILE: ${{ vars.DRAFTLY_DEVELOPER_ID_PROFILE }}
          DRAFTLY_SPARKLE_PUBLIC_KEY: ${{ vars.DRAFTLY_SPARKLE_PUBLIC_KEY }}
          APPLE_DEVELOPER_ID_P12_B64: ${{ secrets.APPLE_DEVELOPER_ID_P12_B64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_DEVELOPER_ID_PROFILE_B64: ${{ secrets.APPLE_DEVELOPER_ID_PROFILE_B64 }}
          APPLE_NOTARY_API_KEY_B64: ${{ secrets.APPLE_NOTARY_API_KEY_B64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bash scripts/release-candidate-ci.sh
      - name: Save verified candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: draftly-release-candidate-${{ env.RELEASE_TAG }}
          path: |
            .build/release-candidates/${{ env.RELEASE_TAG }}/Draftly.zip
            .build/release-candidates/${{ env.RELEASE_TAG }}/Draftly.zip.sha256
            .build/release-candidates/${{ env.RELEASE_TAG }}/candidate.json
            .build/release-candidates/${{ env.RELEASE_TAG }}/signing-report.json
            .build/release-candidates/${{ env.RELEASE_TAG }}/notary-submission.json
            .build/release-candidates/${{ env.RELEASE_TAG }}/READY
          if-no-files-found: error
          retention-days: 14
      - name: Preserve incomplete notary submission for recovery
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: draftly-notary-recovery-${{ env.RELEASE_TAG }}
          path: |
            .build/release-candidates/${{ env.RELEASE_TAG }}/notary-submission.json
            .build/release-candidates/${{ env.RELEASE_TAG }}/notary-submission.zip
          if-no-files-found: ignore
          retention-days: 14
