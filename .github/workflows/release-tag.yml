name: Request release from main

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: write

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the trusted main workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Invalid release tag.' >&2
            exit 1
          fi
          gh workflow run release.yml --ref main -f "tag=$TAG_NAME"
