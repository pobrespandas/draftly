name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Run the full CI or diagnose one macOS suite
        type: choice
        default: all
        options:
          - all
          - LibrarySplitViewTests
          - TypewriterScrollingTests

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: "${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic != '' && inputs.diagnostic != 'all' && format('Diagnostic: {0}', inputs.diagnostic) || 'Build and test on macOS' }}"
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependency
        run: python -m pip install 'Pillow>=10,<13' 'cryptography>=44,<46'
      - name: Resolve Sparkle tools
        run: swift package resolve
      - name: Check toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run Python checks
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Check Actions matrix structure
        run: python scripts/audit-action-api.py --check
      - name: Run Swift tests and verify inventory
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.diagnostic == 'all' || inputs.diagnostic == '' }}
        run: python scripts/run-swift-tests.py --output-dir "$RUNNER_TEMP/draftly-test-results"
      - name: Run one suite for diagnosis
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic != 'all' && inputs.diagnostic != '' }}
        env:
          DIAGNOSTIC_SUITE: ${{ inputs.diagnostic }}
        run: python scripts/run-swift-tests.py --output-dir "$RUNNER_TEMP/draftly-test-results" --diagnostic-suite "$DIAGNOSTIC_SUITE"
      - name: Build local application
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.diagnostic == 'all' || inputs.diagnostic == '' }}
        run: scripts/build-app.sh --local
      - name: Check local package metadata
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.diagnostic == 'all' || inputs.diagnostic == '' }}
        shell: bash
        run: |
          app=.build/xcode/Build/Products/Debug/Draftly.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")" = com.pobrespandas.draftly
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleName' "$app/Contents/Info.plist")" = Draftly
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleURLTypes:0:CFBundleURLSchemes:0' "$app/Contents/Info.plist")" = draftly
          codesign --verify --deep --strict "$app"
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-results
          path: ${{ runner.temp }}/draftly-test-results
          if-no-files-found: ignore
          retention-days: 7
