name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Run the full CI or diagnose one macOS suite
        type: choice
        default: all
        options:
          - all
          - LibrarySplitViewTests
          - TypewriterScrollingTests
          - ThemeRenderingTests
          - ReleaseEnvironmentDenied
          - Toolchain27
          - FullOn27
          - Display26
          - LargeDisplayPanels26

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic || 'all' }}
  cancel-in-progress: true

jobs:
  plan:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.diagnostic != 'ReleaseEnvironmentDenied' }}
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scope.outputs.native }}
      tooling: ${{ steps.scope.outputs.tooling }}
      website: ${{ steps.scope.outputs.website }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select checks from changed files
        id: scope
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE_CHECKS: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          DIAGNOSTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic || '' }}
        run: python3 scripts/ci-change-scope.py --base "$CHANGE_BASE" --head "$CHANGE_HEAD" --force "$FORCE_CHECKS" --diagnostic "$DIAGNOSTIC" >> "$GITHUB_OUTPUT"

  tooling:
    needs: plan
    if: ${{ needs.plan.outputs.tooling == 'true' }}
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install script test dependencies
        run: python -m pip install 'Pillow>=10,<13' 'cryptography>=44,<46'
      - name: Test scripts, including macOS command adapters
        run: python -m unittest discover -s scripts -p 'test_*.py'

  website:
    needs: plan
    if: ${{ needs.plan.outputs.website == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test website/release.test.mjs

  matrix:
    needs: plan
    if: ${{ needs.plan.outputs.matrix == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/audit-action-api.py --check

  macos:
    needs: plan
    if: ${{ needs.plan.outputs.native == 'true' }}
    name: "${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic != '' && inputs.diagnostic != 'all' && format('Diagnostic: {0}', inputs.diagnostic) || 'Native build and tests' }}"
    runs-on: ${{ github.event_name == 'workflow_dispatch' && (inputs.diagnostic == 'Toolchain27' || inputs.diagnostic == 'FullOn27') && 'xcode-27' || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Sparkle tools
        run: swift package resolve
      - name: Check toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run Swift tests and verify inventory
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.diagnostic == 'all' || inputs.diagnostic == '' || inputs.diagnostic == 'FullOn27' }}
        run: python scripts/run-swift-tests.py --output-dir "$RUNNER_TEMP/draftly-test-results"
      - name: Run one suite for diagnosis
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.diagnostic == 'LibrarySplitViewTests' || inputs.diagnostic == 'TypewriterScrollingTests' || inputs.diagnostic == 'ThemeRenderingTests' || inputs.diagnostic == 'LargeDisplayPanels26') }}
        env:
          DIAGNOSTIC_SUITE: ${{ inputs.diagnostic }}
        run: |
          if [[ "$DIAGNOSTIC_SUITE" == LargeDisplayPanels26 ]]; then
            swift scripts/configure-hosted-display.swift
            DIAGNOSTIC_SUITE=LibrarySplitViewTests
          fi
          python scripts/run-swift-tests.py --output-dir "$RUNNER_TEMP/draftly-test-results" --diagnostic-suite "$DIAGNOSTIC_SUITE"
      - name: Check the release toolchain
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic == 'Toolchain27' }}
        run: python scripts/release-toolchain.py
      - name: Inspect available display modes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic == 'Display26' }}
        run: |
          # Swift interpolation is literal shell input.
          # shellcheck disable=SC2016
          swift -e 'import CoreGraphics; let d = CGMainDisplayID(); let modes = (CGDisplayCopyAllDisplayModes(d, nil) as? [CGDisplayMode]) ?? []; print("Display modes:", Array(Set(modes.map { "\($0.width)x\($0.height)" })).sorted().joined(separator: ", "))'
      - name: Build local application
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.diagnostic == 'all' || inputs.diagnostic == '' || inputs.diagnostic == 'FullOn27' }}
        run: scripts/build-app.sh --local
      - name: Check local package metadata
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.diagnostic == 'all' || inputs.diagnostic == '' || inputs.diagnostic == 'FullOn27' }}
        shell: bash
        run: |
          app=.build/xcode/Build/Products/Debug/Draftly.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")" = com.pobrespandas.draftly
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleName' "$app/Contents/Info.plist")" = Draftly
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleURLTypes:0:CFBundleURLSchemes:0' "$app/Contents/Info.plist")" = draftly
          codesign --verify --deep --strict "$app"
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-results
          path: ${{ runner.temp }}/draftly-test-results
          if-no-files-found: ignore
          retention-days: 7

  result:
    name: Build and test on macOS
    needs: [plan, macos, tooling, website, matrix]
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.diagnostic != 'ReleaseEnvironmentDenied') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require each selected check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-change-scope.py --verify-results

  release-environment-denied:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic == 'ReleaseEnvironmentDenied' && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Reject unexpected access
        run: |
          echo 'An untrusted branch reached the release environment.' >&2
          exit 1
