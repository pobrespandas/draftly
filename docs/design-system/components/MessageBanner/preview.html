<!-- @dsCard group="Feedback" height=260 subtitle="HTML rendition of ActionMessageBannerView" -->
<div class="dy-frame" style="background:var(--window)">
  <div class="dy-banner info" role="status"><span class="sym" aria-label="Info"><svg class="dy-icon solid" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7"/><path d="M7.2 7h1.6v5H7.2zM7.2 4h1.6v1.6H7.2z" fill="var(--material)"/></svg></span><span class="msg">Copied 230 characters to the clipboard.</span><button aria-label="Dismiss message"><svg class="dy-icon" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
  <div class="dy-banner success" role="status"><span class="sym" aria-label="Success"><svg class="dy-icon solid" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7"/><path d="M4.8 8.2l2.1 2.1 4.3-4.6" fill="none" stroke="var(--material)" stroke-width="1.6"/></svg></span><span class="msg">Action “Send to Things” finished.</span><button aria-label="Dismiss message"><svg class="dy-icon" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
  <div class="dy-banner warning" role="status"><span class="sym" aria-label="Warning"><svg class="dy-icon solid" viewBox="0 0 16 16"><path d="M8 1.5l7 12.5H1z"/><path d="M7.3 6h1.4v4H7.3zM7.3 11h1.4v1.4H7.3z" fill="var(--material)"/></svg></span><span class="msg">iCloud is not configured. Drafts stay on this Mac.</span><button aria-label="Dismiss message"><svg class="dy-icon" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
  <div class="dy-banner error" role="alert"><span class="sym" aria-label="Error"><svg class="dy-icon solid" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7"/><path d="M5.5 5.5l5 5M10.5 5.5l-5 5" stroke="var(--material)" stroke-width="1.6"/></svg></span><span class="msg">The script step failed: editor is not defined.</span><button aria-label="Dismiss message"><svg class="dy-icon" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
</div>
